name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['15', '16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: flexgateway_test
          POSTGRES_USER: flexgw
          POSTGRES_PASSWORD: flexgw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flexgw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Run unit tests
        run: |
          go test -race -count=1 -coverprofile=coverage.out $(go list ./... | grep -v /plugin/v1)
      - name: Run integration tests
        run: |
          go test -race -count=1 -tags=integration -p 2 $(go list ./... | grep -v /plugin/v1)
        env:
          FLEXGW_TEST_DATABASE_URL: postgres://flexgw:flexgw_test@localhost:5432/flexgateway_test?sslmode=disable
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: coverage.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build all binaries
        run: make build
      - name: Verify container builds
        run: docker build --target gateway -t flexgateway:ci .
      - name: Verify image sizes
        run: |
          docker build --target gateway -t apiloom-gw:size-check .
          docker build --target controlplane -t apiloom-cp:size-check .
          GW_SIZE=$(docker image inspect apiloom-gw:size-check --format='{{.Size}}')
          CP_SIZE=$(docker image inspect apiloom-cp:size-check --format='{{.Size}}')
          echo "Gateway: $((GW_SIZE / 1024 / 1024))MB"
          echo "Controlplane: $((CP_SIZE / 1024 / 1024))MB"
          [ $GW_SIZE -lt 52428800 ] || (echo "Gateway image exceeds 50MB limit" && exit 1)
          [ $CP_SIZE -lt 62914560 ] || (echo "Controlplane image exceeds 60MB limit" && exit 1)

  examples-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build example plugins
        run: |
          go build ./examples/plugins/webhook/...
          go build ./examples/plugins/custom-auth/...
          go build ./examples/plugins/response-transform/...
      - name: Test example plugins
        run: |
          go test ./examples/plugins/webhook/...
          go test ./examples/plugins/custom-auth/...
          go test ./examples/plugins/response-transform/...

  compose-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 120
        timeout-minutes: 8
      - name: Controlplane health check
        run: |
          curl -sf --retry 10 --retry-delay 3 --retry-connrefused \
            http://localhost:18081/healthz
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Tear down
        if: always()
        run: docker compose down -v

  # --- Security Gates ---
  # All five gates below block merges on failure via branch protection required checks.

  sast-gosec:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        run: gosec -exclude-generated -fmt sarif -out gosec.sarif ./...
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-go

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a paid licence for organisation repos,
      # so run the open-source gitleaks CLI directly. Config: .gitleaks.toml
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o /tmp/checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" /tmp/checksums.txt | awk '{print $1"  /tmp/gitleaks.tar.gz"}' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Run gitleaks
        run: /tmp/gitleaks git --redact --no-banner .

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest
      - name: Check licenses
        run: |
          go-licenses check ./... \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,0BSD,Unlicense

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # --- Benchmarks ---

  bench-compare:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Bench PR branch
        run: go test -bench=. -benchmem -count=5 $(go list ./... | grep -v /plugin/v1) | tee /tmp/bench-new.txt
      - name: Checkout main
        run: git checkout origin/main
      - name: Bench main branch
        run: go test -bench=. -benchmem -count=5 $(go list ./... | grep -v /plugin/v1) | tee /tmp/bench-old.txt
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Compare (fail if >10% regression)
        run: |
          benchstat /tmp/bench-old.txt /tmp/bench-new.txt | tee bench-comparison.txt
          if grep -E '\+[1-9][0-9]{1,}\..*%' bench-comparison.txt; then
            echo "Benchmark regression >10% detected"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bench-comparison
          path: bench-comparison.txt

  bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=5 $(go list ./... | grep -v /plugin/v1) | tee bench.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench.txt
