name: Security

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 6 AM UTC
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --target gateway -t flexgateway:scan .
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: flexgateway:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
