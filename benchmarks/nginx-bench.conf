server {
    listen 80;

    location /healthz {
        return 200 '{"status":"healthy"}';
        add_header Content-Type application/json;
    }

    location /demo/get {
        return 200 '{"id":1,"name":"benchmark-resource","status":"active"}';
        add_header Content-Type application/json;
    }

    location /demo/post {
        return 200 '{"created":true,"id":42}';
        add_header Content-Type application/json;
    }

    location / {
        return 200 '{"ok":true}';
        add_header Content-Type application/json;
    }
}
