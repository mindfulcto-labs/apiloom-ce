apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flexgateway.fullname" . }}
  labels:
    {{- include "flexgateway.labels" . | nindent 4 }}
data:
  FLEXGW_LOG_LEVEL: {{ .Values.gateway.logLevel | quote }}
  FLEXGW_SHUTDOWN_TIMEOUT: {{ .Values.gateway.shutdownTimeout | quote }}
  FLEXGW_READ_TIMEOUT: {{ .Values.gateway.readTimeout | quote }}
  FLEXGW_WRITE_TIMEOUT: {{ .Values.gateway.writeTimeout | quote }}
  FLEXGW_IDLE_TIMEOUT: {{ .Values.gateway.idleTimeout | quote }}
