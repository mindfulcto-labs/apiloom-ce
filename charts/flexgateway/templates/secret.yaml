apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flexgateway.fullname" . }}
  labels:
    {{- include "flexgateway.labels" . | nindent 4 }}
type: Opaque
data:
  FLEXGW_DATABASE_URL: {{ include "flexgateway.databaseDSN" . | b64enc | quote }}
  database-url: {{ include "flexgateway.databaseDSN" . | b64enc | quote }}
