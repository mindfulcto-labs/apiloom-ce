apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flexconsumers.flexgateway.io
spec:
  group: flexgateway.io
  names:
    kind: FlexConsumer
    listKind: FlexConsumerList
    plural: flexconsumers
    singular: flexconsumer
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - name
                - org
              properties:
                name:
                  type: string
                org:
                  type: string
                apiKeys:
                  type: array
                  items:
                    type: string
                rateLimit:
                  type: integer
                  description: Optional rate limit override (requests per minute).
                metadata:
                  type: object
                  additionalProperties:
                    type: string
