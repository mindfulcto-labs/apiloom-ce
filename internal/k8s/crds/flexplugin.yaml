apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flexplugins.flexgateway.io
spec:
  group: flexgateway.io
  names:
    kind: FlexPlugin
    listKind: FlexPluginList
    plural: flexplugins
    singular: flexplugin
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - name
                - type
                - enabled
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum:
                    - native
                    - grpc
                config:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                targets:
                  type: array
                  items:
                    type: object
                    required:
                      - kind
                      - name
                    properties:
                      kind:
                        type: string
                      name:
                        type: string
                enabled:
                  type: boolean
