apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flexroutes.flexgateway.io
spec:
  group: flexgateway.io
  names:
    kind: FlexRoute
    listKind: FlexRouteList
    plural: flexroutes
    singular: flexroute
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - name
                - endpoint
                - method
                - backend
              properties:
                name:
                  type: string
                endpoint:
                  type: string
                method:
                  type: string
                backend:
                  type: string
                  description: Reference to a backend by name.
                blocks:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      config:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                metadata:
                  type: object
                  additionalProperties:
                    type: string
